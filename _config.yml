# ============================================================
#  _config.yml — edit this to update your personal info
# ============================================================

# Basic info
name:     "Sukhleen Kaur"
title:    "Software Engineer & Artist"
location: "Salt Lake City, UT"
availability: "open to work"
email:    "sukhleenk1113@gmail.com"

# Site URL (used for the social share card)
url: "https://sukhleenk.github.io"

# Meta description for search engines
description: "Portfolio of Sukhleen Kaur, a software engineer and artist in Salt Lake City. Full-stack web, iOS, and Python. Open to work."

# Bio — the paragraph under your name in the hero
bio: >
  Two years of industry experience across backend services, data pipelines,
  and full-stack web and mobile apps, plus a shelf of shipped side projects
  with real users. I sweat the details in both my code and my interfaces,
  because I’m an artist when I’m not an engineer (and usually both at once).

# Words that cycle in the hero ("I build ___")
rotator_words:
  - full-stack apps
  - iOS apps
  - dev tools
  - data pipelines
  - things with care

# Scrolling ticker under the hero
marquee:
  - open to software roles
  - salt lake city or remote
  - full-stack · iOS · python
  - 2 apps on the App Store

# Social links — comment out any you don't want shown
social:
  github:   "https://github.com/sukhleenk"
  linkedin: "https://linkedin.com/in/sukhleenkaur13"

# Jekyll settings — don't change these
markdown:  kramdown
permalink: pretty

# builds /sitemap.xml for search engines (bundled with GitHub Pages)
plugins:
  - jekyll-sitemap

# keep repo files out of the published site and the sitemap
# (setting this replaces Jekyll's defaults, so they're listed too)
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
