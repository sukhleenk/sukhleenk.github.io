# _data/projects.yml
#
# Three groups:
#   featured — the big card at the top of the Work section
#   apps     — the two-up iOS app cards (mock: aera | tidemark picks the
#              little animated phone preview; swap for real screenshots
#              in index.html when ready)
#   tools    — developer & research tool cards (these alternate sides
#              automatically, first one text-left, next text-right, etc.)

featured:
  - name: "Paletto"
    eyebrow: "Featured · SaaS for artists"
    description: >
      Full-stack SaaS for artists to manage commissions, projects, inventory,
      and finances. Built web-first with Next.js and Supabase, alongside a
      cross-platform Expo mobile app. Designed in Figma across web and iOS so
      it never gets in the way of the creative process. Iterated on the
      dashboard and navigation from early user feedback, simplifying the
      hierarchy so logging a session or tracking a commission takes fewer
      taps. Grown from zero to ~32 monthly users.
    tags: [TypeScript, Next.js, React, Node.js, PostgreSQL, Supabase, Tailwind CSS, Expo]
    shot_web: "assets/img/paletto-web.png"
    shot_phone: "assets/img/paletto-ios.png"
    links:
      - label: "Visit Paletto"
        url: "https://mypaletto.vercel.app"

apps:
  - name: "Aera"
    # subtitle: "Calm Breathing"
    eyebrow: "iOS · on the App Store"
    icon: "assets/img/app-aera.jpg"
    tilt: "-0.6deg"
    screenshot: "assets/img/aera.png"
    description: >
      Most breathing apps are too complicated to use mid-panic-attack.
      I designed Aera in Figma around one principle: <em>radical
      simplicity</em>. Every decision came back to one question: would
      someone in a panic actually use this without becoming more stressed?
    links:
      - label: "App Store"
        url: "https://apps.apple.com/us/app/aera-calm-breathing/id6766367179"

  - name: "Tidemark"
    # subtitle: "Hydration Guide"
    eyebrow: "iOS · on the App Store"
    icon: "assets/img/app-tidemark.jpg"
    tilt: "0.6deg"
    screenshot: "assets/img/tidemark.png"
    description: >
      A personal hydration companion with a different paradigm: it guides users on their hydration
      needs throughout the day, instead of making them log every single
      glass of water like a chore.
    links:
      - label: "App Store"
        url: "https://apps.apple.com/us/app/tidemark-hydration-guide/id6772892443"

  - name: "Rue"
    # subtitle: "Period Tracker"
    eyebrow: "iOS · on the App Store"
    icon: "assets/img/rueicon.png"
    tilt: "-0.5deg"
    screenshot: "assets/img/rue.png"
    description: >
      Period apps assume a textbook 28-day cycle, putting everyone in the same cluster. Rue is a period tracker that tells you what&rsquo;s normal for <em>you</em>, not a statistical average.
      It allows logging of symptoms, mood, sleep, and flow&mdash, so you can be free from stress of wondering if your cycle is normal.
    links:
      - label: "App Store"
        url: "https://apps.apple.com/us/app/rue-period-cycle-tracker/id6782203656"

tools:
  - name: "Hublands"
    description: >
      An open-source interactive atlas of the Hugging Face Hub. Maps models
      and datasets as a browsable survey chart where position encodes semantic 
      similarity. An offline Github Actions pipeline fetches and embeds every repo. 
      The browser renders the GPU points with deck.gl. Born from aiding researchers 
      to see the shape of the Hub instead of searching for names you already know.
    tags: [Next.js, TypeScript, deck.gl, WebGL, Python, UMAP, sentence-transformers, Hugging Face]
    image: "assets/img/hublands.png"
    links:
      - label: "Live website"
        url: "https://hublands.vercel.app"
  - name: "Spool"
    description: >
      A native macOS menu-bar app, built collaboratively, that turns rough idea
      dumps into structured markdown. Everything runs on-device against a local
      OpenAI-compatible model server, spun up only when a document is queued and
      evicted from memory once the work is done. Drafts arrive by file picker or a watched folder. Ships
      as a single SPM executable and fully open-source.
    tags: [Swift, SwiftUI, SPM, macOS, Ollama, Local LLMs]
    image: "assets/img/spool.png"
    links:
      - label: "View code"
        url: "https://github.com/soumildatta/spool"

  - name: "Sift"
    description: >
      A macOS/Linux menu-bar app with 12 active users that fetches and
      summarizes ArXiv papers using on-device transformer models and a local
      NLP pipeline for semantic grouping and ranking. Iteratively improved
      from real researcher feedback.
    tags: [Python, SQLite, Huggingface Transformers, PyTorch, Scikit-learn, Rumps]
    image: "assets/img/sift.png"
    links:
      - label: "View code"
        url: "https://github.com/sukhleenk/sift"

  - name: "API Latency Monitor"
    description: >
      A Python CLI tool published on PyPI that monitors HTTP endpoints for
      latency degradation, with full test coverage across the HTTP engine,
      database layer, and formatter. Sends Telegram notifications on
      important degradation events. Born from wanting a simple, zero-config
      way to track endpoint health without standing up Prometheus, Grafana,
      or a full APM stack.
    tags: [Python, Click, SQLite, pytest, Docker, PyPI]
    image: "assets/img/alm_cli.png"
    links:
      - label: "View code"
        url: "https://github.com/sukhleenk/API-Latency-Monitor"
      - label: "PyPI"
        url: "https://pypi.org/project/api-latency-monitor/"
